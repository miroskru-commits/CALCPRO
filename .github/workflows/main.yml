name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Build Web
        run: |
          npm install
          npm run build

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.calcpro.app",
            "appName": "CALCPRO",
            "webDir": "dist"
          }
          EOF

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Configure Release Keystore
        run: |
          echo "android.enableJetifier=true" >> android/gradle.properties
          keytool -genkeypair -v -keystore android/app/release.keystore -alias procalc -keyalg RSA -keysize 2048 -validity 10000 -storepass procalc123 -keypass procalc123 -dname "CN=PROCALC, OU=App, O=PROCALC, L=Moscow, S=Moscow, C=RU"
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'procalc123'
                      keyAlias 'procalc'
                      keyPassword 'procalc123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CALCPRO-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
